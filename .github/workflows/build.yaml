name: build

on:
  push:
    branches: [ main ]
    # 排除 README.md 修改触发构建
    paths-ignore:
      - 'README.md'
      - 'docs/**'  # 可选：如果以后有 docs 目录也可排除
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

# 并发控制
# 当同一个分支有新的 push 时，自动取消正在进行的旧构建，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # 使用环境变量定义版本，比 matrix 更简洁（如果是单版本）
    env:
      BAZEL_VERSION: 8.5.1
      # Bazelisk 会自动读取这个环境变量，无需生成 .bazelversion 文件
      USE_BAZEL_VERSION: 8.5.1

    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.18.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: true

      - name: Check Bazel version
        run: bazel version

      - name: Bazel build
        # 增加 --color=yes 增强日志可读性
        run: |
          bazel build --config=linux-luckfox --curses=no --color=yes //...